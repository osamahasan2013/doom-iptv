name: Free IPTV daily check

# Builds free/*.json from open, trusted sources, checks every link and removes dead ones.
on:
  schedule:
    - cron: '23 1 * * *'   # every day 01:23 UTC (04:23 Riyadh)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/free_iptv/**']

permissions:
  contents: write

concurrency: { group: free-iptv, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/free_iptv/build.py
      - name: Publish updated list
        run: |
          git config user.name "doom-iptv-bot"
          git config user.email "doom-iptv-bot@users.noreply.github.com"
          # keep today's results, but always on top of the newest main (another run or a code push may have landed meanwhile)
          cp -r free /tmp/free-new
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -rf free && cp -r /tmp/free-new free && git add free
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Free IPTV: daily check $(date -u +%F)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1
