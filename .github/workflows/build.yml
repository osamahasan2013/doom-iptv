name: Build DOOM IPTV apps

on:
  push:
    branches: [main]
    paths-ignore: ['free/**', '**.md', 'scripts/free_iptv/**', '.github/workflows/free-iptv.yml']
  workflow_dispatch:

concurrency: { group: app-build, cancel-in-progress: true }

jobs:
  android:
    name: Android / Android TV APK
    runs-on: ubuntu-latest
    env:
      DOOM_BUILD: ${{ github.run_number }}
      DOOM_KEY_PASSWORD: ${{ secrets.DOOM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run libs
      - run: echo "window.DOOM_VERSION = '1.0.${{ github.run_number }}';" > www/js/version.js
      - run: npx cap add android
      - name: Unlock the signing key
        if: env.DOOM_KEY_PASSWORD != ''
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/doom-release.jks.enc -out android/app/doom-release.jks -pass env:DOOM_KEY_PASSWORD
      - run: node scripts/patch-android.js
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e0c0e' --splashBackgroundColor '#0e0c0e' || echo "icon generation skipped"
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android && chmod +x gradlew
          if [ -n "$DOOM_KEY_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ../DOOM-IPTV-android.apk
          else
            echo "::warning::DOOM_KEY_PASSWORD secret is missing - this APK cannot update an installed copy"
            ./gradlew assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk ../DOOM-IPTV-android.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: DOOM-IPTV-android, path: DOOM-IPTV-android.apk }

  ios:
    name: iPhone / iPad (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run libs
      - run: echo "window.DOOM_VERSION = '1.0.${{ github.run_number }}';" > www/js/version.js
      - run: npx cap add ios
      - run: node scripts/patch-ios.js
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0e0c0e' --splashBackgroundColor '#0e0c0e' || echo "icon generation skipped"
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../DOOM-IPTV-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: DOOM-IPTV-ios, path: DOOM-IPTV-ios-unsigned.ipa }

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run libs
      - run: echo "window.DOOM_VERSION = '1.0.${{ github.run_number }}';" > www/js/version.js
      - run: npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: DOOM-IPTV-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  web:
    name: Web / PWA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund hls.js mpegts.js
      - run: npm run libs
      - run: echo "window.DOOM_VERSION = '1.0.${{ github.run_number }}';" > www/js/version.js
      - uses: actions/upload-artifact@v4
        with: { name: DOOM-IPTV-web, path: www }

  release:
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Reuse the last good file for any platform GitHub could not build this time
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          reuse() { # $1 = folder, $2 = file pattern
            ls out/$1/$2 >/dev/null 2>&1 && return 0
            mkdir -p out/$1
            for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName -q '.[].tagName'); do
              if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$2" -D out/$1 2>/dev/null; then echo "reused $2 from $tag"; return 0; fi
            done
            echo "no earlier $2 found"
          }
          reuse DOOM-IPTV-android '*.apk'
          reuse DOOM-IPTV-ios '*.ipa'
          reuse DOOM-IPTV-macOS '*.dmg'
          reuse DOOM-IPTV-Windows '*.exe'
          reuse DOOM-IPTV-Linux '*.AppImage'
          ls -R out | head -40
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DOOM IPTV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android / Android TV: DOOM-IPTV-android.apk
            iPhone / iPad: DOOM-IPTV-ios-unsigned.ipa (sign & install with Sideloadly)
            Windows: .exe · macOS: .dmg · Linux: .AppImage / .deb
          files: |
            out/DOOM-IPTV-android/*.apk
            out/DOOM-IPTV-ios/*.ipa
            out/DOOM-IPTV-Windows/*
            out/DOOM-IPTV-macOS/*
            out/DOOM-IPTV-Linux/*
          fail_on_unmatched_files: false
