name: Build DOOM IPTV apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android / Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npm run libs
      - run: npx cap add android
      - run: node scripts/patch-android.js
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a0f1e' --splashBackgroundColor '#0a0f1e' || echo "icon generation skipped"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk DOOM-IPTV-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: DOOM-IPTV-android, path: DOOM-IPTV-android.apk }

  ios:
    name: iPhone / iPad (unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run libs
      - run: npx cap add ios
      - run: node scripts/patch-ios.js
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0a0f1e' --splashBackgroundColor '#0a0f1e' || echo "icon generation skipped"
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../DOOM-IPTV-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: DOOM-IPTV-ios, path: DOOM-IPTV-ios-unsigned.ipa }

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run libs
      - run: npx electron-builder --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: DOOM-IPTV-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  web:
    name: Web / PWA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund hls.js mpegts.js
      - run: npm run libs
      - uses: actions/upload-artifact@v4
        with: { name: DOOM-IPTV-web, path: www }

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with: { files: out/**/* }
